[workspace]
name = "panel-flowdash"
# The dev label is only used for packages pinned to it below.
channels = ["conda-forge", "pyviz", { channel = "pyviz/label/dev", priority = -1 }]
platforms = ["osx-arm64", "linux-64", "win-64"]
preview = ["pixi-build"]
# Name the PyPI packages that the dev label's conda packages provide, so PyPI
# packages depending on them (panel-agents, panel-reactflow, ...) do not install
# a second copy from PyPI.
conda-pypi-map = { "pyviz/label/dev" = "pixi-dev-label-map.json" }
requires-pixi = ">=0.68.1"

[package]
name = "panel_flowdash"
version = "9999.0.0" # dynamic versioning: https://github.com/prefix-dev/pixi/issues/5360

[package.build]
backend = { name = "pixi-build-python", version = ">=0.4.4" }

[package.host-dependencies]
hatchling = "*"
hatch-vcs = "*"

[package.run-dependencies]
python = ">=3.12"
python-gil = '*'
markdown-it-py = "*"
numpy = "*"
pandas = ">=1.5"
panel = ">=1.11.0rc0"
panel-material-ui = ">=0.17.0b3"
panel-splitjs = ">=0.4.0"
param = ">=2.3.0"
pyyaml = "*"

[dependencies]
panel_flowdash = { path = "." }
# Page's rail and header_color arrived in 0.17.0b3, which is only on the pyviz dev
# label so far. TODO: Move to the pyviz channel once 0.17.0 is released.
panel-material-ui = { version = ">=0.17.0b3", channel = "pyviz/label/dev" }
# panel-material-ui 0.17 needs Panel 1.11, which is only on the pyviz dev label so far.
# TODO: Move to the pyviz channel once 1.11.0 is released.
panel = { version = ">=1.11.0rc0", channel = "pyviz/label/dev" }

[pypi-dependencies]
# TODO: Add these to conda-forge / pyviz
# Pre-release floors matching pyproject.toml until panel-reactflow and panel-tiles
# 0.6.0 are released.
panel_reactflow = ">=0.6.0b7"
panel_tiles = ">=0.6.0b2"
# A prerelease floor, which uv's default mode allows for this package alone.
panel-agents = ">=0.1.0b10"

[feature.test.dependencies]
pytest = ">=6"
pytest-cov = "*"
mypy = "*"

[feature.test.pypi-dependencies]
pytest-asyncio = ">=0.23"

[feature.test.tasks]
test = "pytest"
test-coverage = "pytest --cov=panel_flowdash --cov-report=xml --cov-report=term-missing"

[feature.agent.pypi-dependencies]
panel-agents = { version = ">=0.1.0b10", extras = ["pydantic-ai"] }

[feature.build.dependencies]
python-build = "*"
twine = "*"
wheel = "*"

[feature.build.tasks]
build-wheel = "python -m build ."
check-wheel = "twine check dist/*"

[feature.lint.dependencies]
pre-commit = "*"

[feature.lint.tasks]
lint = "pre-commit run --all-files"
lint-install = "pre-commit install"

[feature.py312.dependencies]
python = "3.12.*"
[feature.py313.dependencies]
python = "3.13.*"
[feature.py314.dependencies]
python = "3.14.*"

# Carrying failures along edges needs param >= 2.5, which is only on the dev label so far.
[feature.param-dev]
channels = [{ channel = "pyviz/label/dev", priority = -1 }]

[feature.param-dev.dependencies]
param = { version = ">=2.5.0b5", channel = "pyviz/label/dev" }

# "if-necessary" refuses panel_reactflow and panel_tiles >=0.6.0b0 while a stable 0.5
# exists, so this environment cannot be solved from scratch. Go back to "if-necessary"
# once panel-reactflow and panel-tiles 0.6.0 are released.
[feature.param-dev.pypi-options]
prerelease-mode = "if-necessary-or-explicit"

[feature.test-ui]
channels = ["microsoft"]

[feature.test-ui.dependencies]
playwright = "*"
pytest-playwright = "*"
pytest-rerunfailures = "*"
pytest-xdist = "*"
jupyter_server = "*"
esbuild = "*"
packaging = "*"

[feature.test-ui.tasks]
_install-ui = 'playwright install chromium'

[feature.test-ui.tasks.test-ui]
cmd = 'pytest tests/ui --ui --browser chromium -n logical --dist loadgroup --reruns 3 --reruns-delay 10'
depends-on = ["_install-ui"]

[feature.docs.dependencies]
zensical = "*"
mkdocstrings-python = "*"

[feature.docs.tasks]
docs = "zensical serve"
docs-build = "zensical build"

[environments]
default = ["test", "agent"]
# The floor runs without the agent extra, so pydantic-ai stays optional.
test-312 = ["py312", "test"]
test-313 = ["py313", "test", "agent"]
test-314 = ["py314", "test", "agent"]
test-param-dev = ["py314", "test", "param-dev"]
test-ui = ["py312", "test", "test-ui", "agent"]
docs = ["docs"]
build = ["build"]
lint = { features = ["lint"], no-default-feature = true }
