name: CI
on:
  pull_request:
    branches:
      - "**"
    types: [opened, synchronize, reopened, ready_for_review, labeled]
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      target:
        description: "Test matrix to run"
        type: choice
        options:
          - default
          - full
          - downstream
        default: full
      cache:
        description: "Use the pixi lock cache"
        type: boolean
        default: true
  schedule:
    - cron: "0 3 * * 1"

permissions: {}

concurrency:
  # Adding a label other than full-ci gets a group of its own, so it does not cancel a running build.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}${{ github.event.action == 'labeled' && github.event.label.name != 'full-ci' && format('-{0}', github.run_id) || '' }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash -e {0}

jobs:
  setup:
    name: Setup workflow
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      run: ${{ github.event.action != 'labeled' || github.event.label.name == 'full-ci' }}
      # Scheduled, manual and tag runs skip the filter and test everything.
      code_change: ${{ steps.filter.outputs.code || 'true' }}
      img_change: ${{ steps.filter.outputs.img || 'false' }}
      matrix: ${{ env.MATRIX }}
      ui_matrix: ${{ env.UI_MATRIX }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name == 'push' && github.ref_type == 'branch'
        with:
          persist-credentials: false
      - name: Check for code changes
        uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4
        if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref_type == 'branch')
        id: filter
        with:
          filters: |
            code:
              - 'src/**'
              - 'tests/ui/**'
              - 'tests/conftest.py'
              - 'pyproject.toml'
              - 'pixi.toml'
              - '.github/workflows/ci.yml'
            img:
              - '**/*.png'
      - name: Set matrix option
        env:
          GITHUB_EVENT_INPUTS_TARGET: ${{ github.event.inputs.target }}
          # Draft PRs test on Linux only, unless labelled full-ci.
          DRAFT: ${{ github.event.pull_request.draft == true && !contains(github.event.pull_request.labels.*.name, 'full-ci') }}
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == 'workflow_dispatch' ]]; then
            OPTION=${GITHUB_EVENT_INPUTS_TARGET}
          elif [[ "${DRAFT}" == 'true' ]]; then
            OPTION="draft"
          elif [[ "${GITHUB_EVENT_NAME}" == 'schedule' ]]; then
            OPTION="full"
          elif [[ "${GITHUB_EVENT_NAME}" == 'push' && "${GITHUB_REF_TYPE}" == 'tag' ]]; then
            OPTION="full"
          else
            OPTION="default"
          fi
          echo "MATRIX_OPTION=$OPTION" >> $GITHUB_ENV
          if [[ "$OPTION" == 'draft' ]]; then
            UI_OS='["ubuntu-latest"]'
          else
            UI_OS='["ubuntu-latest", "macos-latest", "windows-latest"]'
          fi
          UI_MATRIX=$(jq -nc --argjson os "$UI_OS" '{
              "environment": ["test-ui"],
              "os": $os,
              "shard": [1, 2],
              "shards": [2]
          }')
          echo "UI_MATRIX=$UI_MATRIX" >> $GITHUB_ENV
      - name: Set test matrix with 'draft' option
        if: env.MATRIX_OPTION == 'draft'
        run: |
          MATRIX=$(jq -nsc '{
              "os": ["ubuntu-latest"],
              "environment": ["test-312"]
          }')
          echo "MATRIX=$MATRIX" >> $GITHUB_ENV
      - name: Set test matrix with 'default' option
        if: env.MATRIX_OPTION == 'default'
        run: |
          MATRIX=$(jq -nsc '{
              "os": ["ubuntu-latest", "macos-latest", "windows-latest"],
              "environment": ["test-312", "test-314"],
              "include": [{"os": "ubuntu-latest", "environment": "test-param-dev"}]
          }')
          echo "MATRIX=$MATRIX" >> $GITHUB_ENV
      - name: Set test matrix with 'full' option
        if: env.MATRIX_OPTION == 'full'
        run: |
          MATRIX=$(jq -nsc '{
              "os": ["ubuntu-latest", "macos-latest", "windows-latest"],
              "environment": ["test-312", "test-313", "test-314"],
              "include": [{"os": "ubuntu-latest", "environment": "test-param-dev"}]
          }')
          echo "MATRIX=$MATRIX" >> $GITHUB_ENV
      - name: Set test matrix with 'downstream' option
        if: env.MATRIX_OPTION == 'downstream'
        run: |
          MATRIX=$(jq -nsc '{
              "os": ["ubuntu-latest"],
              "environment": ["test-312"]
          }')
          echo "MATRIX=$MATRIX" >> $GITHUB_ENV

  pixi_lock:
    name: Pixi lock
    needs: [setup]
    if: needs.setup.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: holoviz-dev/holoviz_tasks/pixi-lock@1a9884850782b0b80ba2e91b573e7d63d9d3c3dc # v1
        with:
          cache: ${{ github.event.inputs.cache == 'true' || github.event.inputs.cache == '' }}

  pre_commit:
    name: Run pre-commit
    needs: [setup]
    if: needs.setup.outputs.run == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: holoviz-dev/holoviz_tasks/pre-commit@1a9884850782b0b80ba2e91b573e7d63d9d3c3dc # v1
      - name: Set git credentials
        if: needs.setup.outputs.img_change == 'true'
        run: git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
      - uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd # v3.0.1
        if: needs.setup.outputs.img_change == 'true'
        with:
          extra_args: -a --hook-stage manual oxipng || true --
      - uses: stefanzweifel/git-auto-commit-action@04702edda442b2e678b25b537cec683a1493fcb9 # v7
        if: needs.setup.outputs.img_change == 'true'
        with:
          commit_message: "Optimize PNG images (lossless)"
          file_pattern: "*.png"

  pytest:
    timeout-minutes: 40
    runs-on: ${{ matrix.os }}
    needs: [pre_commit, setup, pixi_lock]
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.setup.outputs.matrix) }}
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up pixi
        uses: prefix-dev/setup-pixi@f00437f565399d418b0acc85936d12c1fb668347 # v0.10.1
        with:
          environments: ${{ matrix.environment }}
      - name: Run pytest
        env:
          ENV: ${{ matrix.environment }}
          FLOWDASH_REQUIRE_FAILURES: ${{ matrix.environment == 'test-param-dev' && '1' || '' }}
        run: pixi run -e "${ENV}" test-coverage --color=yes

  pytest_ui:
    name: ui:${{ matrix.environment }}:${{ matrix.os }}:${{ matrix.shard }}
    needs: [pre_commit, setup, pixi_lock]
    runs-on: ${{ matrix.os }}
    if: needs.setup.outputs.code_change == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.setup.outputs.ui_matrix) }}
    timeout-minutes: 40
    env:
      PANEL_LOG_LEVEL: info
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Pixi
        uses: prefix-dev/setup-pixi@f00437f565399d418b0acc85936d12c1fb668347 # v0.10.1
        with:
          environments: ${{ matrix.environment }}

      - name: Configure Coverage
        if: matrix.os == 'ubuntu-latest'
        run: |
          echo "[run]" > .uicoveragerc
          echo "concurrency = greenlet" >> .uicoveragerc
          echo "COV=--cov=panel_flowdash --cov-config=.uicoveragerc --cov-report=xml --cov-report=term" >> $GITHUB_ENV

      - name: Test UI
        env:
          ENV: ${{ matrix.environment }}
          SHARD: ${{ matrix.shard }}/${{ matrix.shards }}
        run: |
          FAIL="--screenshot only-on-failure --full-page-screenshot --output ui_screenshots --tracing retain-on-failure"
          pixi run -e "${ENV}" test-ui --shard "${SHARD}" $COV $FAIL

      - name: Upload UI Screenshots
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: ui_screenshots_${{ runner.os }}_${{ matrix.shard }}
          path: ./ui_screenshots
          if-no-files-found: ignore
