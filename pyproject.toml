[build-system]
requires = [
    "hatchling",
    "hatch-vcs",
    "panel>=1.5.0",
    "packaging",
]
build-backend = "hatchling.build"


[tool.setuptools_scm]
version_scheme = "post-release"

[project]
name = "panel-flowdash"
dynamic = ["version"]
description = 'Extends Panel with a dataflow and draggable grid based dashboard editor.'
readme = "README.md"
license = { text = "BSD" }
requires-python = ">=3.12"
authors = [{ name = "Philipp Rudiger", email = "philipp.jfr@gmail.com" }]
maintainers = [
    { name = "Philipp Rudiger", email = "philipp.jfr@gmail.com" },
]
classifiers = [
    "License :: OSI Approved :: BSD License",
    "Development Status :: 5 - Production/Stable",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Natural Language :: English",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Libraries",
]

dependencies = [
    # Built-in text components render Markdown with it.
    "markdown-it-py",
    # Selections compare and convert bounds with it.
    "numpy",
    "packaging",
    # Imported directly, as panel stops depending on it in 1.11; the
    # copy_on_write option read by transforms arrived in 1.5.
    "pandas >=1.5",
    # panel-material-ui 0.17 needs Panel 1.11, as 1.10 pins it below 0.17.
    "panel >=1.11.0rc0",
    # RunState undo and redo and drop_artifact_versions, which the edit history builds on;
    # 0.1.0b8 shows a version's metadata["detail"] as the history row's tooltip; 0.1.0b9 has SpanView;
    # 0.1.0b13 fits the drawer on a phone screen and makes the single-model label keyboard accessible.
    "panel-agents >=0.1.0b13",
    # Page.rail and Page.header_color arrived in 0.17.0b3.
    "panel-material-ui >=0.17.0rc1",
    # ReactFlow.fit_view, add_nodes/add_edges, graph validation and handle `top` arrived in
    # 0.6.0b1; 0.6.0b2 shows node views that arrive after their node; 0.6.0b6 reports a
    # connection dropped onto a handle that refuses it; 0.6.0b9 keeps the selection when the
    # canvas is remounted in another tab. A pre-release floor,
    # so pip selects it without --pre until 0.6.0 is out.
    "panel-reactflow >=0.6.0b9",
    # collapse_threshold, which the Split tab's collapse buttons rely on, arrived in 0.4.0.
    "panel-splitjs >=0.4.0",
    # TileGrid.selected, preview_band and show_breakpoint_toolbar arrived in 0.6.0b0;
    # 0.6.0b1 adds the --tile-padding variable and clears edit-only state after editing.
    "panel-tiles >=0.6.0b2",
    # Parameter.metadata, read for output port declarations, arrived in 2.3.
    "param >=2.3.0",
    "pyyaml",
    # Spec text is YAML 1.2, so keys like `on` stay strings, edited with its comments kept.
    "ruamel.yaml >=0.18",
]

[project.scripts]
flowdash = "panel_flowdash.command:main"

[project.urls]
Homepage = "https://github.com/panel-extensions/panel-flowdash"
Source = "https://github.com/panel-extensions/panel-flowdash"

[project.optional-dependencies]
# The AI agent of panel_flowdash.agent.tools, which runs on pydantic-ai.
agent = [
    "panel-agents[pydantic-ai]>=0.1.0b13",
]
# Provider keys entered in the admin view, stored encrypted; the key can live in the OS keyring.
secrets = [
    "cryptography",
    "keyring",
]
# Report exports: charts as images, Word documents and notebooks. PDF also needs
# weasyprint (the pdf extra) or a Chromium that Playwright can drive.
export = [
    "nbformat",
    "python-docx",
    "vl-convert-python",
]
pdf = [
    "weasyprint",
]
dev = [
    "pre-commit",
    "pytest-asyncio>=0.23",
    "pytest-rerunfailures",
    "pytest-xdist",
    "pytest",
    "watchfiles",
]
docs = [
    "zensical",
    "mkdocstrings[python]",
]
mypy = [
    "mypy",
    "types-requests",
    "typing-extensions",
    "panel>=1.5.0",
]

[tool.ruff]
line-length = 99
fix = true

[tool.ruff.lint]
ignore = [
    "D102", # missing docstring in public method
    "D203", # one-blank-line-before-class and `no-blank-line-before-class` (D211) are incompatible.
    "D212", # multi-line-summary-first-line. Alternative is to ignore D213 `multi-line-summary-second-line
    "E402",  # Module level import not at top of file
    "E501",  # Line too long
    "E712",  # Avoid equality comparisons to True
    "E731",  # Do not assign a lambda expression, use a def
    "N803",  # Argument name should be lowercase
    "N806",  # Variable name should be lowercase
]
select = [
    "B",    # flake8-bugbear
    "D",    # pydocstyle
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "W",    # pycodestyle warnings
    "I",    # isort
    "PIE",
    "T20",
    "RUF",
    "UP",
]
extend-unsafe-fixes = [
    "F401", # Unused imports
    "F841", # Unused variables
]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]
"*_test.py" = ["D"]
"examples/**" = ["D"]
"manual_tests/**" = ["D", "T201"]
"src/panel_flowdash/ui/__init__.py" = ["D104"]

[tool.ruff.lint.isort]
known-first-party = ["panel_flowdash"]
combine-as-imports = true

[tool.pytest.ini_options]
addopts = "--pyargs --doctest-ignore-import-errors --color=yes"
norecursedirs = "doc .git dist build _build .ipynb_checkpoints examples"
xfail_strict = true
minversion = "7"
log_cli_level = "INFO"
testpaths = ["tests"]
filterwarnings = ["error"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.mypy]
python_version = '3.12'
no_implicit_optional = true
check_untyped_defs = true

[tool.hatch.version]
source = "vcs"
raw-options = { version_scheme = "no-guess-dev" }
